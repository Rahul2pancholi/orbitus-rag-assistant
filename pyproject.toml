[project]
name = "orbitus-rag-assistant"
version = "0.1.0"
description = "AI/RAG Operations Assistant - FastAPI on Lambda + S3, with a fully local mode"
requires-python = ">=3.12,<3.14"
# Runtime deps shipped to Lambda. Keep this list small: it is the deployment package.
dependencies = [
    "fastapi>=0.115",
    "mangum>=0.19",
    "pypdf>=5.0",
    "boto3>=1.35",
    "python-multipart>=0.0.32",
    "fastembed>=0.4",  # embeddings run inside the Lambda (no Bedrock on the AWS Free plan)
]

[dependency-groups]
# Local-only dev server. Not shipped to Lambda.
local = ["uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27", "fpdf2>=2.7"]
infra = ["aws-cdk-lib>=2.160", "constructs>=10"]

[tool.uv]
default-groups = ["local", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
